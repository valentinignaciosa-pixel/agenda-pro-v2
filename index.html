<script>
// URL de tu API de Google Apps Script
const API_URL = "https://script.google.com/macros/s/AKfycbylpnPKVq_lqLYWpzYaaGwZb14mALfhWDZg_6kCZCMQ9dlIBSQQun8vP0o8IeM5F31gKw/exec"; 

let pedidos = [], diaSeleccionado = new Date().toISOString().split('T')[0];
let mesActual = new Date().getMonth(), anioActual = new Date().getFullYear();
let origenVenta = "App";

function formatearMoneda(input) {
    let valor = input.value.replace(/\D/g, "");
    if (valor === "") { input.value = ""; return; }
    input.value = "$" + new Intl.NumberFormat('es-CL').format(valor);
}

function limpiarNumero(texto) {
    return parseFloat(texto.replace(/\D/g, "")) || 0;
}

// 1. CARGA INICIAL Y MOTOR RAYO MCQUEEN (LOCALSTORAGE)
// 1. FUNCIÓN PARA LEER LOS DATOS QUE MANDA GOOGLE
function parseJwt(token) {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
}

// 2. QUÉ HACER CUANDO GOOGLE DIGA "OK, ES ÉL"
async function handleCredentialResponse(response) {
    const user = parseJwt(response.credential);
    const email = user.email;

    try {
        const resp = await fetch(`${API_URL}?action=verificar&email=${email}`);
        const res = await resp.json();

        if (res.registrado) {
            // USUARIO EXISTE: Entra directo
            localStorage.setItem("user_id_sheet", res.idSheet); 
            localStorage.setItem("sesionValentin", new Date().getTime() + 86400000);
            document.getElementById("bloqueo").style.display = "none";
            cargar();
        } else {
            // USUARIO NUEVO: Lanzar el flujo de creación automática
            const nombreNegocio = prompt("¡Bienvenido! No tienes una agenda activa. ¿Cómo se llama tu negocio?");
            
            if (nombreNegocio) {
                document.getElementById("bloqueo").innerHTML = "<h2>🚀 Creando tu sistema...</h2><p>Espera unos segundos mientras configuramos tu Drive y Planillas.</p>";
                
                // Llamamos a una nueva acción en Google Script para ejecutar 'crearNuevoNegocio'
                const crearResp = await fetch(`${API_URL}?action=crear_todo&email=${email}&nombre=${nombreNegocio}`);
                const nuevoRes = await crearResp.json();
                
                if (nuevoRes.status === "ok") {
                    localStorage.setItem("user_id_sheet", nuevoRes.id);
                    localStorage.setItem("sesionValentin", new Date().getTime() + 86400000);
                    location.reload(); // Recarga y entra directo a su nueva agenda
                }
            }
        }
    } catch (e) {
        console.error("Error:", e);
    }
}

// 3. REVISAR SI YA ESTABA LOGUEADO AL ABRIR LA PÁGINA
window.onload = () => {
    const sesion = localStorage.getItem("sesionValentin");
    const bloqueo = document.getElementById("bloqueo");
    
    if (sesion && new Date().getTime() < parseInt(sesion)) {
        // Ya hay sesión: mantenemos oculto y cargamos datos
        document.querySelector(".logo-img").src = localStorage.getItem("user_pic");
        cargar();
    } else {
        // No hay sesión: recién aquí mostramos el login
        bloqueo.style.display = "flex";
    }
};

async function cargar() {
  const idSheetUsuario = localStorage.getItem("user_id_sheet");
  
  if (!idSheetUsuario) return;

  try {
    const resp = await fetch(`${API_URL}?idSheet=${idSheetUsuario}`);
    const data = await resp.json();
    
    // Filtramos filas vacías por si acaso
    pedidos = data.slice(1).filter(fila => fila[0] !== ""); 
    localStorage.setItem("cache_pedidos", JSON.stringify(pedidos));
    
    // IMPORTANTE: Llamar a la función que dibuja
    if (typeof renderizarTodo === "function") {
        renderizarTodo();
    } else {
        console.error("Falta la función renderizarTodo en el código");
    }

  } catch (e) {
    console.error("Error en la carga, intentando usar caché...");
    const cache = localStorage.getItem("cache_pedidos");
    if (cache) {
      pedidos = JSON.parse(cache);
      if (typeof renderizarTodo === "function") renderizarTodo();
    }
  }
}
function cerrarSesion() { 
  localStorage.removeItem("sesionValentin"); 
  localStorage.removeItem("user_name");
  localStorage.removeItem("user_pic");
  location.reload(); 
}
// 3. HERRAMIENTAS SUPERIORES (SOLUCIÓN PUNTOS 1 Y 2)
async function copiarFicha() {
  const btn = event.target; // Captura el botón que hizo clic
  const textoOriginal = btn.innerText;
  const ficha = `📍 DATOS PARA TU PEDIDO:\n\n• Nombre Cliente:\n• Teléfono:\n• Descripción Pedido:\n• ¿Retiro en Local o Despacho?:\n• Si es con despacho ingrese la dirección:`;
  
  try {
    await navigator.clipboard.writeText(ficha);
    // Feedback visual para el emprendedor
    btn.innerText = "✅ ¡Copiado!";
    btn.style.borderColor = "#25D366";
    btn.style.color = "#25D366";
    
    setTimeout(() => {
      btn.innerText = textoOriginal;
      btn.style.borderColor = "#4dabf7";
      btn.style.color = "#4dabf7";
    }, 2000);
  } catch (err) {
    // Plan B por si el navegador bloquea el acceso
    const textArea = document.createElement("textarea");
    textArea.value = ficha;
    document.body.appendChild(textArea);
    textArea.select();
    try {
      document.execCommand('copy');
      alert("📋 Ficha copiada (Método alternativo)");
    } catch (e) {
      alert("❌ Error al copiar. Por favor, copia el texto manualmente.");
    }
    document.body.removeChild(textArea);
  }
}

function toggleInteligente() {
  const box = document.getElementById("boxInteligente");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

// 4. FORMULARIO Y GUARDADO (CON VALIDACIONES - TRIÁNGULO DE ORO)
function abrirManual() {
  origenVenta = "App";
  document.getElementById("labelOrigen").innerText = "Modo: App";
  limpiarForm();
  document.getElementById("formulario").style.display = "block";
}

function cerrarModal() {
  document.getElementById("formulario").style.display = "none";
  limpiarForm();
}

function cancelarProceso() { 
  cerrarModal(); 
}

function limpiarForm() {
  ["nombre", "telefono", "descripcion", "precio", "abonado", "pendiente", "direccion", "fecha", "hora"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("tipoPago").value = "";
  document.getElementById("metodoEntrega").value = "Entrega en mano";
  document.getElementById("direccion").style.display = "none";
  document.getElementById("btnGuardar").disabled = false;
  document.getElementById("btnGuardar").innerText = "Confirmar y Guardar";
}

function toggleDireccion(){ 
  document.getElementById("direccion").style.display = document.getElementById("metodoEntrega").value === "Despacho a domicilio" ? "block" : "none"; 
}

function calcularFinanzas(){
  const p = limpiarNumero(document.getElementById("precio").value);
  const a = limpiarNumero(document.getElementById("abonado").value);
  const pen = p - a; // Aquí restamos
  
  // Formateamos el resultado como moneda chilena
  document.getElementById("pendiente").value = "$" + new Intl.NumberFormat('es-CL').format(pen);
  
  const s = document.getElementById("tipoPago");
  if(p > 0 && a === p) s.value = "Pago Anticipado";
  else if(a > 0 && a < p) s.value = "Pago Parcial";
  else if(p > 0 && a === 0) s.value = "Contra Entrega";
}

async function guardar() {
    // ... (mantén tus validaciones de campos nombre, tel, etc.)
    
    const idEdicion = document.getElementById("formulario").dataset.idEdicion;
    const data = {
        action: idEdicion ? "editar" : "nuevo",
        idSheet: localStorage.getItem("user_id_sheet"), // <-- ESTO ES LO QUE FALTABA
        id: idEdicion || new Date().getTime(),
        nombre: document.getElementById("nombre").value,
        telefono: document.getElementById("telefono").value,
        descripcion: document.getElementById("descripcion").value,
        fecha: document.getElementById("fecha").value,
        hora: document.getElementById("hora").value || "Sin Hora",
        precio: limpiarNumero(document.getElementById("precio").value),
        montoAbonado: limpiarNumero(document.getElementById("abonado").value),
        montoPendiente: limpiarNumero(document.getElementById("pendiente").value),
        tipoPago: document.getElementById("tipoPago").value,
        metodoEntrega: document.getElementById("metodoEntrega").value,
        direccion: document.getElementById("direccion").value,
        dispositivo: "Netlify App",
        origen: origenVenta
    };

    // Actualización visual rápida
    const fila = [data.id, data.descripcion, data.fecha, data.hora, data.precio, data.tipoPago, data.montoAbonado, data.montoPendiente, "Pendiente", new Date(), data.nombre, data.telefono, data.metodoEntrega, data.direccion, data.dispositivo, data.origen];
    if (idEdicion) {
        pedidos = pedidos.map(p => String(p[0]) === String(idEdicion) ? fila : p);
    } else {
        pedidos.push(fila);
    }

    renderizarTodo(); 
    cerrarModal();

    // Sincronización silenciosa
    try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
        localStorage.setItem("cache_pedidos", JSON.stringify(pedidos));
    } catch (e) {
        console.log("Guardado localmente, se sincronizará luego.");
    }
}
// 5. CALENDARIO Y LISTA (SOLUCIÓN PUNTO 3 Y 4)
function renderCalendario(){
  const cal = document.getElementById("calendario"); cal.innerHTML = "";
  ["L","M","M","J","V","S","D"].forEach(d=> cal.innerHTML += `<div style="color:#4dabf7;font-size:11px;text-align:center;">${d}</div>`);
  const diasMes = new Date(anioActual, mesActual+1, 0).getDate();
  let primerDia = new Date(anioActual, mesActual, 1).getDay();
  if(primerDia === 0) primerDia = 7; // Ajuste para que Domingo sea 7
  
  let conteo = {};
  pedidos.forEach(p => { 
    if(String(p[8]).toLowerCase() === "pendiente"){ 
      let f = String(p[2]).split("T")[0]; 
      conteo[f] = (conteo[f] || 0) + 1; 
    } 
  });
  
  for(let i=1; i<primerDia; i++) cal.innerHTML += `<div></div>`;
  for(let d=1; d<=diasMes; d++){
    let f = `${anioActual}-${String(mesActual+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let c = conteo[f] || 0;
    let clase = "dia" + (c >= 4 ? " rojo" : "") + (f === diaSeleccionado ? " seleccionado" : "");
    cal.innerHTML += `<div class="${clase}" onclick="seleccionarDia('${f}')"><span>${d}</span><span style="font-size:10px;color:#4dabf7">${c}</span></div>`;
  }
}

function seleccionarDia(f){ diaSeleccionado = f; renderCalendario(); renderLista(); }

function renderLista(){
  const container = document.getElementById("lista"); 
  container.innerHTML = "";
  
  const filtrados = pedidos.filter(p => 
    String(p[2]).split("T")[0] === diaSeleccionado && 
    String(p[8]).toLowerCase() === "pendiente"
  );

  filtrados.sort((a, b) => {
    let hA = !a[3] || a[3] === "Sin Hora" || a[3] === "" ? "23:59" : a[3];
    let hB = !b[3] || b[3] === "Sin Hora" || b[3] === "" ? "23:59" : b[3];
    return hA.localeCompare(hB);
  });

  filtrados.forEach(p => {
    // --- SOLUCIÓN HORA DEFINITIVA ---
let horaOriginal = String(p[3]);
let horaLimpia = "S/H";

if (horaOriginal && horaOriginal !== "Sin Hora" && horaOriginal !== "undefined") {
    // Si Google manda una fecha completa (ej: 1899-12-30T20:00:00)
    if (horaOriginal.includes("T")) {
        horaLimpia = horaOriginal.split("T")[1].substring(0, 5);
    } 
    // Si viene como "Sat Dec 30 1899 20:00:00 GMT..."
    else if (horaOriginal.includes(":") && horaOriginal.length > 10) {
        let partes = horaOriginal.split(" ");
        let tiempo = partes.find(p => p.includes(":"));
        horaLimpia = tiempo ? tiempo.substring(0, 5) : horaOriginal;
    }
    // Si ya viene limpia como "20:00"
    else {
        horaLimpia = horaOriginal.substring(0, 5);
    }
}
    let num = String(p[11]).replace(/\D/g, ''); 
    let precio = parseFloat(p[4]) || 0;
    let abono = parseFloat(p[6]) || 0;
    let pen = parseFloat(p[7]) || 0;
    
    let deuda_html = pen <= 0 
      ? `<b style="color:#25D366;">$0 - Pagado 🎉</b>` 
      : `| Abonó: $${new Intl.NumberFormat('es-CL').format(abono)} | <b style="color:#ff4d4d;">Debe: $${new Intl.NumberFormat('es-CL').format(pen)}</b>`;
    
    let direccionBtn = "";
if(p[12] === "Despacho a domicilio" && p[13]) {
    const dirMap = encodeURIComponent(p[13]);
    // URL Corregida para Google Maps
    direccionBtn = `<br><a href="https://www.google.com/maps/search/?api=1&query=${dirMap}" target="_blank" style="display:inline-block; margin-top:5px; background:#4285F4; color:white; padding:4px 8px; border-radius:5px; text-decoration:none; font-size:11px;">📍 Ver en Google Maps</a>`;
}

    container.innerHTML += `
      <div class="card" id="card-${p[0]}" data-id="${p[0]}">
        <div style="display:flex; align-items:start; gap:10px;">
          <div class="handle" style="cursor:grab; font-size:20px; color:#ccc; padding:10px 0;">☰</div>
          
          <div style="flex:1">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <h2 style="margin:0; color:#4dabf7; font-size:20px;">📦 ${p[1]}</h2>
              <div style="background:#e3f2fd; color:#4dabf7; padding:4px 10px; border-radius:10px; font-weight:bold; font-size:13px;">
                🕒 ${horaLimpia || 'S/H'}
              </div>
            </div>
            <div style="margin:8px 0;">👤 <b>Cliente:</b> ${p[10]}</div>
            <div>📞 <a class="whatsapp-link" href="https://wa.me/569${num.slice(-8)}" target="_blank">569${num.slice(-8)}</a></div>
            <div class="info-secundaria">
              💰 <b>Total:</b> $${new Intl.NumberFormat('es-CL').format(precio)} ${deuda_html}<br>
              🚚 <b>Entrega:</b> ${p[12]}
              ${direccionBtn}
            </div>
            <button class="btn-entregado" onclick="marcar('${p[0]}')">✔ Marcar Entregado</button>
            <div class="btn-group">
              <button class="btn-small" style="background:#e3f2fd; color:#4dabf7;" onclick="cargarEdicion('${p[0]}')">📝 Editar</button>
              <button class="btn-small btn-reagendar" onclick="reagendar('${p[0]}')">📅 Reagendar</button>
              <button class="btn-small btn-anular" onclick="anular('${p[0]}')">🚫 Anular</button>
            </div>
          </div>
        </div>
      </div>`;
  });

  if (window.sortableInstance) {
    window.sortableInstance.destroy(); 
  }
  
  window.sortableInstance = new Sortable(container, {
  handle: '.handle', 
  animation: 150,
  ghostClass: 'blue-background-class',
  onEnd: async function (evt) {
        const idPedido = evt.item.getAttribute('data-id');
        const nombrePedido = evt.item.querySelector('h2').innerText;
        // Solo llamamos a la función de la hora
        solicitarNuevaHora(idPedido, nombrePedido);
    }
  });
}
// 6. ACCIONES DE PEDIDO (ACTUALIZACIÓN OPTIMISTA)
async function marcar(id){ 
  if(confirm("¿Entregado?")){ 
    const card = document.getElementById(`card-${id}`);
    if(card) card.style.opacity = "0.3"; // Efecto visual inmediato
    
    try {
      await fetch(API_URL, { method:"POST", body: JSON.stringify({action:"entregado", id:id}) });
      // Actualizamos localmente el estado para que desaparezca de la lista
      pedidos = pedidos.map(p => p[0] == id ? (p[8]="ENTREGADO", p) : p);
      localStorage.setItem("cache_pedidos", JSON.stringify(pedidos));
      renderizarTodo();
    } catch (e) {
      alert("Error al actualizar. Intenta de nuevo.");
      if(card) card.style.opacity = "1";
    }
  } 
}

async function anular(id){ 
  if(confirm("¿Anular pedido?")){

}

let idReagendando = null; // Variable global para saber qué pedido estamos moviendo

// 1. Esta abre el cuadrito lindo
function reagendar(id) {
    idReagendando = id;
    const p = pedidos.find(x => x[0] == id);
    if(!p) return;

    // Pre-cargamos la fecha y hora que ya tenía el pedido
    document.getElementById("reagendarFecha").value = String(p[2]).split('T')[0];
    let horaActual = String(p[3]);
    document.getElementById("reagendarHora").value = (horaActual && horaActual !== "Sin Hora") ? horaActual : "10:00";
    
    document.getElementById("modalReagendar").style.display = "flex";
}

// 2. Esta cierra el cuadrito
function cerrarModalReagendar() {
    document.getElementById("modalReagendar").style.display = "none";
}

// 3. Esta es la que hace el trabajo pesado (Modo Rayo)
async function confirmarReagendar() {
    const id = idReagendando;
    const nF = document.getElementById("reagendarFecha").value;
    const nH = document.getElementById("reagendarHora").value;

    if(!nF || !nH) return alert("Falta fecha u hora");

    // --- MODO RAYO: Actualización visual instantánea ---
    pedidos = pedidos.map(p => {
        if (String(p[0]) === String(id)) {
            p[2] = nF; // Cambia fecha
            p[3] = nH; // Cambia hora
        }
        return p;
    });

    renderizarTodo(); // Redibuja el calendario y lista al tiro
    cerrarModalReagendar(); // Cierra el modal de inmediato

    // --- Sincronización silenciosa con Google ---
    try {
        await fetch(API_URL, { 
            method: "POST", 
            body: JSON.stringify({ 
                action: "reagendar", 
                id: id, 
                nuevaFecha: nF, 
                nuevaHora: nH 
            }) 
        });
        localStorage.setItem("cache_pedidos", JSON.stringify(pedidos));
        console.log("✅ Reagendado en la nube");
    } catch (e) {
        console.error("❌ Error al sincronizar, pero quedó guardado en el celu.");
    }
}
// 7. SELECTORES Y NOTIFICACIONES
function initSelectors(){
  const m = document.getElementById("mes"), a = document.getElementById("anio");
  if(m.options.length > 0) return;
  ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"].forEach((nm,i)=> m.innerHTML += `<option value="${i}" ${i==mesActual?'selected':''}>${nm}</option>`);
  for(let y=2026; y<=2030; y++) a.innerHTML += `<option value="${y}" ${y==anioActual?'selected':''}>${y}</option>`;
  m.onchange = a.onchange = () => { mesActual = parseInt(m.value); anioActual = parseInt(a.value); renderCalendario(); };
}

function actualizarNotificaciones() {
  const ahora = new Date();
  const hoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
  
  const domingo = new Date(hoy);
  domingo.setDate(hoy.getDate() + (7 - (hoy.getDay() || 7)));
  domingo.setHours(23, 59, 59, 999);

  let enSemana = 0;
  let atrasados = 0;

  pedidos.forEach(p => {
    if (String(p[8]).toLowerCase() === "pendiente") {
      const fechaEntrega = new Date(String(p[2]).split('T')[0].replace(/-/g, '/'));
      fechaEntrega.setHours(0, 0, 0, 0);
      
      if (fechaEntrega < hoy) {
        atrasados++;
      } else if (fechaEntrega <= domingo) {
        enSemana++;
      }
    }
  });

  const barra = document.getElementById("barraAlertas");
  if (enSemana > 0 || atrasados > 0) {
    barra.style.display = "block";
    const textoSemana = enSemana === 1 ? "pedido pendiente" : "pedidos pendientes";
    const textoAtrasados = atrasados === 1 ? "pedido" : "pedidos";
    document.getElementById("contSemana").innerText = `📅 Esta semana: ${enSemana} ${textoSemana}`;
    document.getElementById("contAtrasados").innerText = atrasados > 0 ? `⚠️ Atrasados: ${atrasados} ${textoAtrasados}` : "";
  } else {
    barra.style.display = "none";
  }
}

// 8. LECTURA INTELIGENTE (IA AUTOLLENADO)
function procesarTexto() {
  const texto = document.getElementById("textoPegado").value;
  if (!texto) return;
  
  origenVenta = "App_Chat";
  document.getElementById("labelOrigen").innerText = "Modo: App_Chat";
  limpiarForm();

  const extraer = (regex) => { 
    const m = texto.match(regex); 
    return m ? m[1].trim() : ""; 
  };

  // Extraer Nombre y Descripción
  document.getElementById("nombre").value = extraer(/(?:Nombre|Cliente).*?:\s*(.*)/i);
  document.getElementById("descripcion").value = extraer(/(?:Descripci.n|Pedido|Producto).*?:\s*(.*)/i);

  // Extraer Teléfono (Regla +569)
  const lineaTelefono = texto.match(/(?:Tel.fono|Celular|Fono).*?:\s*(\d+)/i);
  let finalNum = "";
  if (lineaTelefono) {
    let numExtraido = lineaTelefono[1].replace(/\s+/g, ''); 
    if (numExtraido.length === 8) finalNum = "9" + numExtraido;
    else if (numExtraido.length === 9) finalNum = numExtraido;
    else finalNum = numExtraido.slice(-9);
  }
  document.getElementById("telefono").value = finalNum;

  // Extraer Despacho y Dirección
  if (/despacho|domicilio|envio/i.test(texto)) {
    document.getElementById("metodoEntrega").value = "Despacho a domicilio";
    document.getElementById("direccion").style.display = "block";
    const matchDir = texto.match(/(?:Direcci.n|Dir|ubicaci.n).*?:\s*(.*)/i);
    if (matchDir) document.getElementById("direccion").value = matchDir[1].trim();
  }

  document.getElementById("boxInteligente").style.display = "none";
  document.getElementById("formulario").style.display = "block";
}

    });
